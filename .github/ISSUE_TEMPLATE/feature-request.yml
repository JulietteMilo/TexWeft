name: Feature or preset request
description: Ask for a new engine preset, format or workflow.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: For an engine or game preset, link the official documentation of its texture/channel layout if you can.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How often would you use it?
